name: Testing

on:
  workflow_dispatch:
    inputs:
      allow_migrations:
        description: Authorize migrations / recovery (deploy latest main; be available to intervene)
        type: boolean
        default: false
  push:
    branches: ['main']
  pull_request:

permissions: {}

env:
  MAPTILER_API_KEY: ${{ vars.MAPTILER_API_KEY }}
  MAPTILER_MAP_STYLE_LIGHT: ${{ vars.MAPTILER_MAP_STYLE_LIGHT }}
  MAPTILER_MAP_STYLE_DARK: ${{ vars.MAPTILER_MAP_STYLE_DARK }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
  IKUYO_BACKEND_AUTH: ${{ vars.IKUYO_BACKEND_AUTH }}
  IKUYO_BACKEND_TRIP_READS: ${{ vars.IKUYO_BACKEND_TRIP_READS }}
  IKUYO_BACKEND_ACTIVITY_WRITES: ${{ vars.IKUYO_BACKEND_ACTIVITY_WRITES }}
  IKUYO_BACKEND_CONTENT_WRITES: ${{ vars.IKUYO_BACKEND_CONTENT_WRITES }}
  IKUYO_BACKEND_TASK_WRITES: ${{ vars.IKUYO_BACKEND_TASK_WRITES }}
  IKUYO_BACKEND_SHARING_WRITES: ${{ vars.IKUYO_BACKEND_SHARING_WRITES }}
  IKUYO_BACKEND_TRIP_WRITES: ${{ vars.IKUYO_BACKEND_TRIP_WRITES }}
  IKUYO_MAINTENANCE_MODE: ${{ vars.IKUYO_MAINTENANCE_MODE }}
  IKUYO_READ_ONLY_MODE: ${{ vars.IKUYO_READ_ONLY_MODE }}
  IKUYO_VIEW_TRANSITIONS: ${{ vars.IKUYO_VIEW_TRANSITIONS }}

jobs:
  test:
    name: "Lint, Typecheck, Test, and Build"
    if: github.event_name == 'pull_request'
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    services: &test-services
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: ikuyo_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - &setup-php
        name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, pdo, pdo_mysql, sqlite, xml, zip, intl, gd, pcntl, posix
      - name: Test and build
        uses: ./.github/actions/test

  deploy:
    name: Test and Deploy to Production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: ikuyo-production-deployment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: production
    services: *test-services
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-php
      - name: Check production deployment gate
        id: gate
        env: &deploy-env
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          DEPLOY_DRAIN_SECONDS: ${{ vars.DEPLOY_DRAIN_SECONDS || '30' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_migrations && 'true' || 'false' }}
        run: php scripts/deploy/deploy.php --check
      - name: Test and build
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/test
      - name: Bundle PHP metadata service and backend into dist
        if: steps.gate.outputs.ready == 'true'
        run: |
          cp index.php dist/index.php
          cp -r app shared backend dist/
      - name: Deploy in place
        if: steps.gate.outputs.ready == 'true'
        env: *deploy-env
        run: php scripts/deploy/deploy.php
