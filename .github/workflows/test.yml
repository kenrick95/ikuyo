name: Testing

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  php-backend:
    name: "PHP lint, style, static, test"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, pdo, sqlite, xml, zip, intl, gd
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Provision .env and app key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear
      - name: PHP syntax lint
        run: composer lint
      - name: PHP code style (Pint)
        run: composer style
      - name: PHP static analysis (PHPStan)
        run: composer static
      - name: Generate temporary application key
        run: touch .env && php artisan key:generate
      - name: PHPUnit
        run: composer test

  test:
    name: "Lint, Typecheck, Test, and Build"
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build-artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    env:
      INSTANT_APP_ID: ${{ vars.INSTANT_APP_ID }}
      MAPTILER_API_KEY: ${{ vars.MAPTILER_API_KEY }}
      MAPTILER_MAP_STYLE_LIGHT: ${{ vars.MAPTILER_MAP_STYLE_LIGHT }}
      MAPTILER_MAP_STYLE_DARK: ${{ vars.MAPTILER_MAP_STYLE_DARK }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install
      - name: Biome CI
        run: pnpm biome:ci
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Bundle PHP metadata service into dist
        run: |
          cp index.php dist/index.php
          cp -r app dist/app
          cp -r shared dist/shared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact-upload-step
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
