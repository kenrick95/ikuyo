name: Deploy

on:
  workflow_call:
    inputs:
      allow_migrations:
        description: Explicit manual authorization to migrate or recover production
        type: boolean
        default: false
    secrets:
      DEPLOY_SSH_KEY:
        required: true

permissions: {}

jobs:
  deploy:
    name: "Deploy to Production"
    concurrency:
      group: ikuyo-production-deployment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      DEPLOY_DRAIN_SECONDS: ${{ vars.DEPLOY_DRAIN_SECONDS || '30' }}
      # Only an explicit dispatch can authorize mutations to the production schema.
      ALLOW_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_migrations && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifact
          path: dist/
      - name: Check migration gate and deploy in place
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy/deploy.sh
